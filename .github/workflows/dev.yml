name: Development Deployment

on:
  push:
    branches: [develop]

jobs:
  deploy-dev:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Give execute permissions to linters
        run: |
          chmod +x ./node_modules/.bin/htmlhint
          chmod +x ./node_modules/.bin/stylelint

      - name: Lint HTML
        run: npm run lint:html

      - name: Lint CSS
        run: npm run lint:css

      - name: Build with Parcel
        run: npm run build

      - name: Deploy to GitHub Pages (development)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dev-dist
          destination_dir: development
