name: Development Deployment

on:
  push:
    branches: [develop]

jobs:
  deploy-dev:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '18'

      - run: npm install

      # Ensure permissions for htmlhint binary
      - run: chmod +x ./node_modules/.bin/htmlhint

      # Lint HTML and CSS using local binaries
      - run: ./node_modules/.bin/htmlhint "src/**/*.html"
      - run: ./node_modules/.bin/stylelint "src/**/*.css"

      # Build using Parcel
      - run: npm run build

      # Deploy to development environment
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dev-dist
          destination_dir: development
