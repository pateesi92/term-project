name: PR Validation

on:
  pull_request:
    branches:
      - develop

jobs:
  lint-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm ci

    - name: Fix permissions for htmlhint and stylelint
      run: |
        chmod +x ./node_modules/.bin/htmlhint
        chmod +x ./node_modules/.bin/stylelint

    - name: Run HTMLHint (HTML Lint)
      run: npx htmlhint "**/*.html"

    - name: Run Stylelint (CSS Lint)
      run: npx stylelint "**/*.css"

    - name: Build with Parcel
      run: npx parcel build src/index.html --dist-dir dist
