lint:
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm ci

    - name: Fix permissions
      run: chmod +x ./node_modules/.bin/htmlhint

    - name: Run HTMLHint
      run: npx htmlhint "**/*.html"

    - name: Run Stylelint
      run: npx stylelint "**/*.css"
